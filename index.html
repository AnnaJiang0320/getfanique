<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetFanique | Custom Festival & Event Fans Manufacturer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #111111; color: #ffffff; }
        .bg-dark-card { background-color: #1a1a1a; }
        .text-brand-orange { color: #FF5A36; }
        .bg-brand-orange { background-color: #FF5A36; }
        .hero-gradient { background: linear-gradient(180deg, rgba(17,17,17,0) 0%, #111111 100%), url('https://images.unsplash.com/photo-1531050171651-a30f5d63bb6d?auto=format&fit=crop&w=1950&q=80'); background-size: cover; background-position: center; }
    </style>
</head>
<body class="font-sans antialiased">
    <nav class="border-b border-gray-800 bg-[#111111]/80 backdrop-blur-md sticky top-0 z-50 h-20 flex justify-between items-center px-4 max-w-7xl mx-auto">
        <span class="text-2xl font-black italic uppercase">GET<span class="text-brand-orange">FANIQUE</span></span>
        <a href="#inquiry" class="bg-brand-orange text-white px-6 py-2 rounded-full font-bold uppercase text-xs tracking-widest hover:opacity-90 transition">Get Quote</a>
    </nav>
    <section class="relative h-[70vh] flex items-center justify-center text-center px-4 hero-gradient">
        <div class="max-w-4xl">
            <h1 class="text-5xl md:text-7xl font-black mb-6 uppercase">Premium <span class="text-brand-orange">Custom Fans</span></h1>
            <p class="text-xl text-gray-400 mb-10 italic">Low MOQ 100pcs. Fast Global Delivery.</p>
            <a href="#inquiry" class="bg-brand-orange text-white px-10 py-4 rounded-full text-lg font-bold hover:scale-105 transition transform inline-block">Request Wholesale Price</a>
        </div>
    </section>
    <section id="inquiry" class="py-24 bg-dark-card border-y border-white/5">
        <div class="max-w-xl mx-auto px-4 text-center">
            <h2 class="text-4xl font-black mb-8 uppercase italic italic">Get a <span class="text-brand-orange">Quote</span></h2>
            <form action="https://formspree.io/f/xgobwpep" method="POST" class="space-y-4">
                <input type="text" name="name" placeholder="Full Name" required class="w-full bg-[#111111] border border-white/10 rounded-xl px-6 py-4 outline-none text-white focus:border-brand-orange">
                <input type="email" name="email" placeholder="Business Email" required class="w-full bg-[#111111] border border-white/10 rounded-xl px-6 py-4 outline-none text-white focus:border-brand-orange">
                <textarea name="message" rows="4" placeholder="Order quantity & requirements..." required class="w-full bg-[#111111] border border-white/10 rounded-xl px-6 py-4 outline-none text-white focus:border-brand-orange"></textarea>
                <button type="submit" class="w-full bg-brand-orange text-white py-5 rounded-xl font-black uppercase italic tracking-widest hover:opacity-90 transition">Send Inquiry</button>
            </form>
        </div>
    </section>
    <footer class="py-12 text-center text-gray-600 text-xs">
        <span class="font-black italic text-white">GET<span class="text-brand-orange">FANIQUE</span></span>
        <p class="mt-2 uppercase tracking-widest italic">Global Export Partner Since 2018</p>
    </footer>
</body>
</html>
